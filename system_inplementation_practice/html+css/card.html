<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        #card {
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: block;
            /* justify-content: center;
            align-items: center; */
            margin: 0 auto;
            width: 300px;
            height: 400px;
            background-color: white;
            border: 2px solid lightgray;
            border-radius: 15px;
        }

        #profile_img {
            margin: 0 auto 20px auto;
            width: 100px;
            height: 100px;
            background-size: cover;
            border-radius: 100%;
            background-image: url('http://ggoreb.com/images/Portrait_Placeholder.png')
        }

        p {
            font-size: 0.9rem;
            color: gray;
        }

        button {
            width: 100px;
            height: 40px;
            background-color: lightblue;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div id="card">
    <img id="profile_img"/>
    <h2>홍길동</h2>
    <p>안녕하세요 <br>
    CSS 박스모델 연습중입니다.</p>
    <button>Follow</button>
    </div>
</body>
</html>
