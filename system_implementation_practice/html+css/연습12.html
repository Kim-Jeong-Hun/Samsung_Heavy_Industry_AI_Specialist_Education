<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .first:first-child {color: red;}
      ol > .second { color: green;}
      .second + .first {color: blue;}
    </style>
  </head>
  <body>
    <ol>
      <li class="first"><h2>1-1</h2></li>
      <li class="second"><h2>1-2</h2></li>
      <li class="first"><h2>1-3</h2></li>
    </ol>
    <ul>
      <li class="third"><h2>2-1</h2></li>
      <li class="second"><h2>2-2</h2></li>
      <li class="third"><h2>2-3</h2></li>
    </ul>
  </body>
</html>
