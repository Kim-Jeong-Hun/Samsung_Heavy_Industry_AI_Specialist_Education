<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 500px;
        margin: 0 auto;
      }
      p {
        background-color: rgb(207, 232, 220);
        border: 2px solid rgb(79, 185, 227);
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
      }
      .abs {
        position: absolute;
        bottom: 0px;
        right: 0px;
        background-color: rgba(255, 84, 104, 0.3);
      }
    </style>
  </head>
  <body>
    <h1>absolute 적용</h1>
    <p>static</p>
    <p class="abs">absolute</p>
    <p>static</p>
  </body>
</html>
