<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            @media print {
                h2 {
                    color: red;
                    font-size: 3rem;
                }
            }

            nav {
                background-color: #333;
            }
            nav ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
            }
            nav li {
                position: relative;
                padding: 14px 20px;
                color: white;
                cursor: pointer;
            }
            nav li:hover {
                background-color: #444;
            }
            .dropdown {
                z-index: 100000;
                display: none;
                position: absolute;
                min-width: 150px;
                top: 48px;
                left: 0;
                background-color: #fff;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            }
            .dropdown li {
                padding: 12px;
                color: #333;
                background-color: #fff;
            }
            .dropdown li:hover {
                background-color: #f5f5f5;
            }
            nav li:hover .dropdown {
                display: block;
            }
            .content {
                position: relative;
                z-index: 5;
                margin: 30px 0;
                padding: 30px;
                background-color: #f9f9f9;
                height: 200px;
                border-top: 2px solid #ddd;
            }
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li>Home</li>
                <li>
                    Services
                    <ul class="dropdown">
                        <li>Web Design</li>
                        <li>Hosting</li>
                        <li>SEO</li>
                    </ul>
                </li>
                <li>Contact</li>
            </ul>
        </nav>
        <div class="content">
            <h2>Welcome!</h2>
            <p>이 본문이 z-index가 높아서 드롭다운이 뒤로 숨어버립니다.</p>
        </div>
    </body>
</html>
