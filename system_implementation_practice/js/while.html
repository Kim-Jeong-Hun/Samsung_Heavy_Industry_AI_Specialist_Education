<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <script>
            let i = 3;
            while (i > 0) {
                console.log(`while: ${i}`);
                i--;
            }
            
            i = 0;
            while(true) {
                i += 1;
                console.log(`while: ${i}`);
                if(i == 3) break
            }
        </script>
    </body>
</html>
