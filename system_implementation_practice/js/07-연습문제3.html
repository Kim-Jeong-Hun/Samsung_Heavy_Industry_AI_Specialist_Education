<head>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css
/bootstrap.min.css"
        rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js
/bootstrap.bundle.min.js"></script>
    <style>
        .dropdown {
            display: inline-block;
        }

        .dropdown + .dropdown {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-3" id="content"></div>
    <script>
        const url = "http://ggoreb.com/dinosaur/info.jsp";
        async function run() {
            const res = await fetch(url, { method: "get" });
            const data = await res.json();

            공룡종류수 = data.length; // 6
            let code = "";
            for (let i = 0; i < 공룡종류수; i++) {
                kind = data[i].kind;
                공룡수 = data[i].dinosaurs.length;
                code += `
    <div class="dropdown">
        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
        ${kind} (${공룡수})
        </button>
        <ul class="dropdown-menu">
        ${data[i].dinosaurs
            .map((v) => {
                return `<li><a class="dropdown-item" href="#">${v.title}</a></li>`;
            })
            .join("")}
        </ul>
    </div>`;
            }

            const content = document.querySelector("#content");
            content.innerHTML = code;
        }

        run()
    </script>
</body>
