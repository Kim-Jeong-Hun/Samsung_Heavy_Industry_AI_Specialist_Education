<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const date = new Date();
        let hour = date.getHours();
        let min = date.getMinutes();
        let sec = date.getSeconds();
        console.log("현재시각 : ", + hour + "시" + min + "분" + sec + "초")
        if (hour < 12) {
            document.body.style.backgroundImage = 'url("http://ggoreb.com/images/luffy.jpg")'
        } else if (hour < 18) {
            document.body.style.backgroundImage = 'url("http://ggoreb.com/images/luffy.jpg")'
        } else {
            document.body.style.backgroundImage = 'url("http://ggoreb.com/images/luffy.jpg")'
        }
    </script>
</body>
</html>
