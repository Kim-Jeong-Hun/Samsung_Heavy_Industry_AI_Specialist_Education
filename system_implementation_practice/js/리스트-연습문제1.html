<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <script>
            const subjects = [
                ["HTML", "웹 페이지 구조"],
                ["CSS", "스타일 지정"],
                ["JavaScript", "동적 기능 추가"],
            ];


            /* 코드 작성 */
            console.log(`${subjects[0][0]}: ${subjects[0][1]}\n${subjects[1][0]}: ${subjects[1][1]}\n${subjects[2][0]}: ${subjects[2][1]}`)

            const data1 = `${subjects[0][0]} ${subjects[0][1]}<br />`;
            const body = document.querySelector('body');
            body.innerHTML += data1;

            
            const data2 = `${subjects[1][0]} ${subjects[1][1]}<br />`;
            body.innerHTML += data2;


            const data3 = `${subjects[2][0]} ${subjects[2][1]}`;
            body.innerHTML += data3;
        </script>
    </body>
</html>
