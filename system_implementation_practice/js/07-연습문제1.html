<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <div id="show"></div>
        <script>
            const show = document.querySelector("#show");
            function getHen() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        show.innerHTML += "🐔";
                        resolve();
                    }, 1000);
                });
            }

            function getEgg() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        show.innerHTML += " >> 🥚";
                        resolve();
                    }, 1000);
                });
            }

            function cook() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        show.innerHTML += " >> 🍳";
                        resolve();
                    }, 1000);
                });
            }
            getHen().then(getEgg).then(cook);
        </script>
    </body>
</html>
