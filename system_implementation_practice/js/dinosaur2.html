<head>
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css
/bootstrap.min.css"
        rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js
/bootstrap.bundle.min.js"></script>
    <style>
        .dropdown {
            display: inline-block;
        }

        .dropdown + .dropdown {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-3" id="content"></div>
    <script>
    const url = 'http://ggoreb.com/dinosaur/info.jsp';
    fetch(url)
        .then(res => res.json())
        .then(data => {
            let code = '';
            for (let i = 0; i < data.length; i++) {
                const kind = data[i].kind;
                const 공룡수 = data[i].dinosaurs.length;
                const items = data[i].dinosaurs
                    .map(v => `<li><a class="dropdown-item" href="#">${v.title}</a></li>`)
                    .join('');
                code += `
                <div class="dropdown">
                  <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                    ${kind} (${공룡수})
                  </button>
                  <ul class="dropdown-menu" style="max-height: 300px; overflow-y: auto;">
                    ${items}
                  </ul>
                </div>`;
            }
            document.querySelector('#content').innerHTML = code;
        });
</script>
</body>
