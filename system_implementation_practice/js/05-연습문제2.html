<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <script>
            // 부모 클래스 Shape
            class Shape {
                constructor(width, height, color) {
                    this.width = width;
                    this.height = height;
                    this.color = color;
                }
                draw() {
                    console.log(`draw`);
                }
                getArea() {
                    console.log(`getArea`);
                }
            }

            class Rectangle extends Shape {
                constructor(width, height, color) {
                    super(width, height, color);
                }

                draw() {
                    console.log('drawing with ' + this.color);  
                }

                // 메소드 오버라이딩
                getArea() {
                    console.log(this.width * this.height);
                }
            }

            const r = new Rectangle(10, 20, 'Red');
            r.draw();
            r.getArea();
        </script>
    </body>
</html>
