<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <script>
            // 첫 번째 for 사용법
            for (let i=0; i<10; i++) {
                console.log(`for: ${i}`);
            }

            // 두 번째 
            const arr = [1, 2, 3, 4];
            for (let i in arr) {
                console.log(arr[i]);
            }

            // 세번째
            for (let i of arr) {
                console.log(arr[i]);
            }
        </script>
    </body>
</html>
