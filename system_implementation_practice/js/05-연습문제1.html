    <body>
        <script>
            class User {
                constructor(firstName, lastName, age) {
                    this.firstName = firstName;
                    this.lastName = lastName;
                    if(age<0) {
                        age = 0;
                    }
                    this.age = age;
                }
            }

            const user = new User("Steve", "Job", -1);
            console.log(user.age);
        </script>
    </body>
