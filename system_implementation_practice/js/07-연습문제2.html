<!doctype html>
<html lang="en">
    <head>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css
/bootstrap.min.css"
            rel="stylesheet"
        />
        <style>
            h2 {
                font-size: 40px;
                font-weight: bold;
            }

            #content {
                font-size: 20px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="container mt-4">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>약국명</th>
                        <th>전화번호</th>
                        <th>주소</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                    </tr>
                </tbody>
            </table>
        </div>
        <script>
            const h2 = document.querySelector("h2");
            const url =
                "https://ggoreb.pythonanywhere.com/night_pharmacy/data/?search=세종";
            // 코드 작성
            fetch(url)
                .then((res) => res.json())
                .then((data) => {
                    // html 코드를 적기 위한 변수 code
                    let code = ``;
                    for (let i = 0; i < data.data.length; i++) {
                        const name = data.data[i].name;
                        const tel = data.data[i].tel;
                        const road_address = data.data[i].road_address;
                        // if (road_address.startsWith("세종특별자치시")) {
                            code += `<tr><td>${name}</td><td>${tel}</td><td>${road_address}</td></tr>`;
                        // }
                    }
                    document.querySelector("tbody").innerHTML += code;
                });
        </script>
    </body>
</html>
