<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div > div {
                background-color: rgb(207, 232, 220);
                border: 2px solid rgb(79, 185, 227);
                padding: 10px;
                border-radius: 5px;
            }
            .wrapper {
                display: grid;
                grid-gap: 10px;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 100px 100px 100px;
            }
            div > div:nth-child(1) {
                grid-column: 1 / 3;
                grid-row: 1;
            }
            div > div:nth-child(2) {
                grid-column: 3;
                grid-row: 1 / 3;
            }
            div > div:nth-child(3) {
                grid-column: 2 / 4;
                grid-row: 3;
            }
            div > div:nth-child(4) {
                grid-column: 1;
                grid-row: 2 / 4;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div>A</div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
            <div>E</div>
        </div>

        <script>
            const divs = document.querySelectorAll("div > div");
            divs.forEach((div) => {
                // Event 객체 e
                div.addEventListener("click", (e) => {
                    // 원래 색상 기억해놓고 쓰기
                    // const color = e.target.style.backgroundColor;
                    // console.log(color);
                    //div.setAttribute('isClick', true);


                    // 자바스크립트 객체의 속성을 펼쳐서 볼 수 있는 계층적인 트리 구조로 콘솔에 출력
                    console.dir(e);
                    e.target.style.backgroundColor = "lightgray";
                });
            });
        </script>
    </body>
</html>
